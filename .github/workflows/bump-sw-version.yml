# index.html などアプリのファイルが変わったら、sw.js の VERSION を中身のハッシュに自動で書き換える。
# 置き場所：.github/workflows/bump-sw-version.yml
name: bump-sw-version
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tax-furusato.html
      - papaparse.min.js
      - manifest.webmanifest
      - "*.png"
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp VERSION
        run: |
          HASH=$(cat index.html tax-furusato.html papaparse.min.js manifest.webmanifest *.png | sha256sum | cut -c1-8)
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"$HASH\";/" sw.js
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "Bump SW VERSION"
          git push
 
